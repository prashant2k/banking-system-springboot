spring.application.name=banking-system

# ==========================
# H2 DATABASE
# ==========================
spring.datasource.url=jdbc:h2:mem:bankdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ==========================
# JPA
# ==========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================
# H2 Console
# ==========================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==========================
# JWT
# ==========================
jwt.secret=VGhpc0lzQVNlY3VyZUJhbmttb2R1bGVKV1RTZWNyZXRLZXlGb3JQcm9qZWN0
jwt.expiration=3600000

# ==========================
# KAFKA
# ==========================

spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=banking-system-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=com.prashant.bank.*